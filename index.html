<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de prueba</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d8dee4;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    ul {
      margin: 0 0 24px;
      padding-left: 20px;
      color: var(--muted);
    }
    li { margin-bottom: 4px; }
    button {
      font: inherit;
      padding: 9px 16px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #salida {
      margin: 16px 0 0;
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.9rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <h1>Página de prueba</h1>
    <p>Todo está funcionando correctamente. Esta es una página de ejemplo para comprobar que el proyecto renderiza bien.</p>

    <ul>
      <li>HTML, CSS y JavaScript en un solo archivo</li>
      <li>Diseño adaptable a móvil</li>
      <li>Sin dependencias externas</li>
    </ul>

    <button id="boton" type="button">Probar interacción</button>
    <pre id="salida">Esperando clic…</pre>
  </main>

  <script>
    let clics = 0;
    const boton = document.getElementById("boton");
    const salida = document.getElementById("salida");

    boton.addEventListener("click", () => {
      clics++;
      salida.textContent = "Clic registrado: " + clics + (clics === 1 ? " vez" : " veces");
    });
  </script>
</body>
</html>
